<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>meo（ミオ）｜MEO伴走支援サービス</title>
<style>
  :root{--navy:#1D3D6F;--soft2:#F5F8FC;--text:#1F2937;--muted:#5B677A;--accent:#F06A3A}
  html,body{margin:0;min-height:100%;background:var(--soft2);color:var(--text);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
  .box{width:100%;max-width:420px;background:#fff;border-radius:16px;padding:32px 24px;text-align:center;box-shadow:0 1px 2px rgba(29,61,111,.06)}
  .brand{font-size:12px;color:var(--muted);letter-spacing:.08em}
  h1{font-size:30px;margin:6px 0 4px;color:var(--navy);letter-spacing:.04em}
  h1 small{font-size:13px;color:var(--muted);margin-left:6px;letter-spacing:0}
  p{font-size:13.5px;line-height:1.8;color:var(--text);margin:14px 0 0}
  .muted{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="page"><div class="box">
  <div class="brand">MEO伴走支援サービス</div>
  <h1>meo<small>ミオ</small></h1>
  <p>クチコミ経営を、3ヶ月の伴走と専用ツールで。</p>
  <p class="muted">店舗ページは準備中です。<br>アンケートは、お渡ししたQRコードからお進みください。</p>
</div></div>
</body>
</html>
