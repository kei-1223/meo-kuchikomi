<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meoミオ｜Googleマップのクチコミ管理ツール</title>
<meta name="description" content="meoミオは、Googleマップの店舗向けクチコミ管理ツールです。店頭QRからのクチコミ案内と、未返信のクチコミの確認・返信を助けます。">
<style>
  :root{--navy:#1D3D6F;--navy-d:#14294D;--soft:#E9EEF6;--soft2:#F5F8FC;--text:#1F2937;--muted:#5B677A;--line:#D9E0EA;--accent:#F06A3A}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--soft2);color:var(--text);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.8}
  .wrap{max-width:860px;margin:0 auto;padding:0 20px 56px}
  header.top{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  header.top .in{max-width:860px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between}
  header.top .brand{font-size:22px;font-weight:800;letter-spacing:.04em}
  .hero{padding:48px 0 28px}
  .hero h1{font-size:30px;line-height:1.4;color:var(--navy);margin:8px 0 14px}
  .hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .btn{display:inline-block;border-radius:999px;padding:12px 22px;font-size:14px;font-weight:700;text-decoration:none}
  .btn.p{background:var(--navy);color:#fff}
  .btn.g{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
  @media (max-width:640px){.hero h1{font-size:25px}}
  footer{margin-top:48px;border-top:1px solid var(--line);padding-top:18px;font-size:12.5px;color:var(--muted)}
  footer a{color:var(--navy)}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand">meoミオ</div>
</div></header>
<div class="wrap">

<main class="hero">
  <h1>Googleマップのクチコミ管理ツール</h1>
  <div class="acts">
    <a class="btn p" href="/demo/">店舗用デモ</a>
    <a class="btn p" href="/demo/survey/">お客様用デモ</a>
    <a class="btn g" href="/shop/">店舗ログイン</a>
  </div>
</main>

<footer>
  <a href="/sitemap/">サイトマップ</a>
</footer>
</div>
</body>
</html>
