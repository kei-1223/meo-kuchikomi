<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>店舗ログイン｜meo</title>
<style>
  :root{--navy:#1D3D6F;--soft2:#F5F8FC;--text:#1F2937;--muted:#5B677A;--line:#D9E0EA}
  html,body{margin:0;background:var(--soft2);color:var(--text);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
  .box{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:28px 24px;box-shadow:0 1px 2px rgba(29,61,111,.06);box-sizing:border-box}
  .brand{font-size:12px;color:var(--muted);letter-spacing:.06em}
  h1{font-size:20px;margin:4px 0 18px;color:var(--navy)}
  label{display:block;font-size:12.5px;font-weight:700;margin:12px 0 6px}
  input[type=text],input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:13px 12px;font-size:16px;font-family:inherit;box-sizing:border-box}
  input:focus{outline:none;border-color:var(--navy)}
  .row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:13px}
  .row input{width:18px;height:18px;margin:0}
  .btn{display:block;width:100%;border:0;border-radius:999px;padding:14px;font-size:15px;font-weight:700;background:var(--navy);color:#fff;cursor:pointer;font-family:inherit}
  .msg{display:none;background:#FDE8DF;color:#B5441C;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:12px;line-height:1.6}
  .msg.show{display:block}
  .foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}
  .foot a{color:var(--navy)}
</style>
</head>
<body>
<div class="page">
  <form class="box" id="f">
    <div class="brand">MEO伴走支援サービス　meo（ミオ）</div>
    <h1>店舗ページにログイン</h1>
    <label for="sid">店舗ID</label>
    <input type="text" id="sid" name="sid" autocomplete="username" placeholder="店舗ID">
    <label for="pw">パスワード</label>
    <input type="password" id="pw" name="pw" autocomplete="current-password" placeholder="お渡ししたパスワード">
    <div class="row"><input type="checkbox" id="keep" checked><label for="keep" style="margin:0;font-weight:400">このスマホではログインしたままにする（30日）</label></div>
    <button class="btn" type="submit">ログイン</button>
    <div class="msg" id="msg">店舗ページは準備中です。サーバーの準備ができ次第、このままログインできるようになります。</div>
    <p class="foot">パスワードはお店に1つ。スタッフ全員で共有してかまいません。<br><a href="/">トップへ戻る</a></p>
  </form>
</div>
<script>
document.getElementById("f").onsubmit = e => { e.preventDefault(); document.getElementById("msg").classList.add("show"); };
</script>
</body>
</html>
