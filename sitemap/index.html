<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サイトマップ｜meoミオ</title>
<style>
  :root{--navy:#1D3D6F;--bg:#F5F8FC;--line:#D9E0EA;--text:#1F2937}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}
  header{background:var(--navy);color:white}
  header a{color:inherit;font-size:22px;font-weight:800;text-decoration:none}
  .wrap{max-width:860px;margin:0 auto;padding:14px 20px}
  main.wrap{padding-top:36px;padding-bottom:56px}
  h1{margin:0 0 16px;font-size:27px;color:var(--navy)}
  nav ul{margin:0;padding:0 18px;list-style:none;background:white;border:1px solid var(--line);border-radius:14px}
  nav li+li{border-top:1px solid var(--line)}
  nav a{display:block;padding:12px 0;color:var(--navy);font-weight:700;text-underline-offset:3px}
</style>
</head>
<body>
<header><div class="wrap"><a href="/" aria-label="meoミオのトップ">meoミオ</a></div></header>
<main class="wrap">
  <h1>サイトマップ</h1>
  <nav aria-label="公開ページ">
    <ul>
      <li><a href="/">トップ</a></li>
      <li><a href="/demo/">店舗用デモ</a></li>
      <li><a href="/demo/survey/">お客様用デモ</a></li>
      <li><a href="/shop/">店舗ログイン</a></li>
      <li><a href="/privacy/">プライバシーポリシー</a></li>
    </ul>
  </nav>
</main>
</body>
</html>
